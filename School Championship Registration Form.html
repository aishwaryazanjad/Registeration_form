
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Championship Registration</title>
    <link rel="stylesheet" href="School Championship Registration Form.css">
</head>
<body>

    <div class="registration-container">

        <h1>School Championship Registration Form</h1>

        <form id="registrationForm">

            <div class="form-group">
                <label for="school">School name:<span>*</span></label>
                <input type="text" id="school" name="school" required>
            </div>

            <div class="form-group">
                <label>Schooler name:<span>*</span></label>
                <div class="name-fields">
                    <input type="text" name="studentFirstName"
                           placeholder="First" aria-label="Student first name" required>
                    <input type="text" name="studentLastName"
                           placeholder="Last" aria-label="Student last name" required>
                </div>
            </div>

            <div class="form-group">
                <label>Parent name:<span>*</span></label>
                <div class="name-fields">
                    <input type="text" name="parentFirstName"
                           placeholder="First" aria-label="Parent first name" required>
                    <input type="text" name="parentLastName"
                           placeholder="Last" aria-label="Parent last name" required>
                </div>
            </div>

            <div class="form-group">
                <label for="phone">Parent phone:<span>*</span></label>
                <input type="tel" id="phone" name="phone"
                       placeholder="### ### ####"
                       pattern="[0-9+\-\s]{10,15}" required>
            </div>

            <div class="form-group">
                <label for="email">Parent email:<span>*</span></label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="sport">Preferred sport:<span>*</span></label>
                <input type="text" id="sport" name="sport" required>
            </div>

            <div class="verification">
                <label class="verification-title">
                    Verification<span>*</span>
                </label>

                <label class="captcha-box">
                    <input type="checkbox" id="captcha" required>
                    <span>I'm not a robot</span>
                    <div class="captcha-logo">
                        <span>🔄</span>
                        <small>reCAPTCHA</small>
                        <small>Privacy - Terms</small>
                    </div>
                </label>
            </div>

            <div class="submit-container">
                <button type="submit">➤ &nbsp; Submit</button>
            </div>

            <p id="message"></p>

        </form>
    </div>

    <script>
        document.getElementById("registrationForm").addEventListener("submit", function(event) {
            event.preventDefault();

            document.getElementById("message").textContent =
                "Form submitted successfully! (Demo only)";
        });
    </script>

</body>
</html>
