
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="LinkedIn_form.css">
</head>
<body>

    <div class="registration-card">

        <h1>Registration</h1>

        <div class="account-type">
            <label>
                <input type="radio" name="account" value="personal" checked>
                <span class="custom-radio"></span>
                Personal
            </label>

            <label>
                <input type="radio" name="account" value="company">
                <span class="custom-radio"></span>
                Company
            </label>
        </div>

        <form id="registerForm">

            <div class="input-group">
                <span class="input-icon">✉</span>
                <input type="email" placeholder="Email" required>
            </div>

            <div class="input-group">
                <span class="input-icon">♟</span>
                <input type="text" placeholder="Name" required>
            </div>

            <div class="input-group">
                <span class="input-icon">⛨</span>
                <input type="password" placeholder="Password" required>
            </div>

            <div class="gender-options">
                <label>
                    <input type="radio" name="gender" value="male" checked>
                    <span class="custom-radio"></span>
                    Male
                </label>

                <label>
                    <input type="radio" name="gender" value="female">
                    <span class="custom-radio"></span>
                    Female
                </label>
            </div>

            <div class="form-footer">
                <p>
                    By clicking Register, you agree on our
                    <a href="#">terms and condition</a>.
                </p>

                <button type="submit">Register</button>
            </div>

            <p id="message"></p>

        </form>
    </div>

    <script>
        document.getElementById("registerForm").addEventListener("submit", function(event) {
            event.preventDefault();
            document.getElementById("message").textContent =
                "Registration form submitted successfully (demo only).";
        });
    </script>

</body>
</html>
