
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="Welcome_Back_form.css">
</head>
<body>

    <div class="container">

        <div class="form-card">

            <!-- Left Panel -->
            <div class="welcome-panel">
                <div class="welcome-content">
                    <h1>Welcome Back!</h1>

                    <p>
                        Provide your personal details to use all<br>
                        features
                    </p>

                    <button class="signin-btn" type="button">
                        SIGN IN
                    </button>
                </div>
            </div>

            <!-- Right Panel -->
            <div class="signup-panel">
                <h1>Register With</h1>

                <div class="social-icons">
                    <a href="#" aria-label="Google">G+</a>
                    <a href="#" aria-label="Facebook">f</a>
                    <a href="#" aria-label="GitHub">◉</a>
                    <a href="#" aria-label="LinkedIn">in</a>
                </div>

                <h2>OR</h2>

                <p class="form-description">
                    Fill Out The Following Info For Registration
                </p>

                <form id="signupForm">
                    <input
                        type="text"
                        placeholder="Name"
                        aria-label="Name"
                        required
                    >

                    <input
                        type="email"
                        placeholder="Email"
                        aria-label="Email"
                        required
                    >

                    <input
                        type="password"
                        placeholder="Password"
                        aria-label="Password"
                        required
                    >

                    <button class="signup-btn" type="submit">
                        SIGN UP
                    </button>

                    <p id="message"></p>
                </form>
            </div>

        </div>
    </div>

    <script>
        document.getElementById("signupForm").addEventListener("submit", function(event) {
            event.preventDefault();

            document.getElementById("message").textContent =
                "Form submitted successfully (demo only).";
        });
    </script>

</body>
</html>
